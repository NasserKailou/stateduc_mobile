<script>
(function() {
  // ── session 32 FIX 1 : Stubs pour les fonctions jQuery serveur-side ──────────────
  if (typeof set_TOTAL_MatFrml_Champ === 'undefined') {
    window.set_TOTAL_MatFrml_Champ = function() { /* stub — remplacé par computeMatrixTotals() */ };
  }
  if (typeof set_TOTAL_MatFrml === 'undefined') {
    window.set_TOTAL_MatFrml = function() { /* stub — remplacé par computeMatrixTotals() */ };
  }
  if (typeof set_TOTAL_ThemeMat2D === 'undefined') {
    window.set_TOTAL_ThemeMat2D = function() { /* stub */ };
  }

  // ── session 32 FIX 2 : Auto-totaux pure-JS pour matrices NB_/TOT_ ────────────
  function computeMatrixTotals(changedInput) {
    var scope = document.querySelector('.se-mobile-frame') || document;
    var table = changedInput.closest('table.table-questionnaire');
    if (!table) return;
    var allNb = Array.prototype.slice.call(
      table.querySelectorAll('input[type=text]:not([readonly])')
    ).filter(function(el) { return /^NB_/i.test(el.name || ''); });
    if (allNb.length === 0) return;
    var lignes = {}; var cols = {}; var grandTotal = 0;
    allNb.forEach(function(el) {
      var m = el.name.match(/^(NB_[A-Z0-9_]+?)_(\d+)_(\d+)(?:_(\d+))?$/i);
      if (!m) return;
      var li = m[3]; var co = m[4];
      var v = parseFloat(el.value) || 0;
      grandTotal += v;
      if (!lignes[li]) lignes[li] = 0; lignes[li] += v;
      if (co !== undefined) { if (!cols[co]) cols[co] = 0; cols[co] += v; }
    });
    var allTot = Array.prototype.slice.call(table.querySelectorAll('input[readonly]'));
    allTot.forEach(function(el) {
      var n = el.name || '';
      var mLi = n.match(/TOT_[^_]+_ALL_MES_LIGNE_\d+_(\d+)$/i);
      if (mLi) { el.value = lignes[mLi[1]] || 0; return; }
      var mCo = n.match(/TOT_[^_]+_ALL_MES_COLONNE_\d+_(\d+)$/i);
      if (mCo) { el.value = cols[mCo[1]] || 0; return; }
      if (/TOT_[^_]+_ALL_MES(?:_0)?$/i.test(n)) { el.value = grandTotal; }
    });
  }

  function onReady(fn) {
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', fn); } else { fn(); }
  }
  onReady(function() {
    // session 33 : scope au wrapper, pas sur document.body
    var root = document.querySelector('.se-mobile-frame');
    if (root) root.classList.add('mobile-ready');
    var scope = root || document;

    // ── session 32 FIX 3 : Classification tables ──────────────────────────────────
    scope.querySelectorAll('table.table-questionnaire').forEach(function(table) {
      var hasDataFields = table.querySelector('input[name^="NB_"], input[name^="nb_"], input[readonly]') !== null;
      var rows = Array.prototype.slice.call(table.rows || []);
      var maxCells = rows.reduce(function(max, row) { return Math.max(max, row.cells ? row.cells.length : 0); }, 0);
      if (maxCells > 5 && !table.parentElement.classList.contains('table-mobile-scroll')) {
        var wrapper = document.createElement('div');
        wrapper.className = 'table-mobile-scroll';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      }
    });

    // ── session 32 FIX 4 : Câble les auto-totaux sur tous les inputs NB_ ──────────
    scope.querySelectorAll('input[type=text]:not([readonly])').forEach(function(input) {
      if (/^NB_/i.test(input.name || '')) {
        input.addEventListener('input',  function() { computeMatrixTotals(input); });
        input.addEventListener('change', function() { computeMatrixTotals(input); });
      }
    });
    scope.querySelectorAll('table.table-questionnaire').forEach(function(table) {
      var firstNb = table.querySelector('input[type=text]:not([readonly])');
      if (firstNb && /^NB_/i.test(firstNb.name || '')) { computeMatrixTotals(firstNb); }
    });

    // ── inputmode numérique sur champs NB_/TOT_ ──────────────────────────────────
    var numericRegex = /(^|_)(NB|TOT|SUPERFICIE|ANNEE|HEURES|MINITES|MINUTES|NOMBRE|TOTAL|ALL_MES|GP)(_|$)/i;
    scope.querySelectorAll("input[type='text']").forEach(function(input) {
      var signature = [input.name || '', input.id || '', input.getAttribute('name_base') || ''].join(' ');
      if (numericRegex.test(signature)) {
        input.setAttribute('inputmode', 'numeric');
        input.setAttribute('pattern', '[0-9]*');
        input.setAttribute('autocomplete', 'off');
      }
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
    });
    scope.querySelectorAll('textarea').forEach(function(el) {
      el.setAttribute('spellcheck', 'false');
      el.style.minHeight = '90px';
    });

    // ── Option-chip : wrapping radio+label ────────────────────────────────────────
    scope.querySelectorAll('label[for]').forEach(function(label) {
      var targetId = label.getAttribute('for');
      var next = label.nextElementSibling;
      if (!next || next.tagName !== 'INPUT' || next.id !== targetId) return;
      if (label.parentElement && label.parentElement.classList.contains('option-chip')) return;
      var wrap = document.createElement('span');
      wrap.className = 'option-chip';
      label.parentNode.insertBefore(wrap, label);
      wrap.appendChild(label);
      wrap.appendChild(next);
    });
    function refreshCheckedState() {
      scope.querySelectorAll('.option-chip').forEach(function(chip) {
        var input = chip.querySelector("input[type='radio'], input[type='checkbox']");
        chip.classList.toggle('is-checked', !!(input && input.checked));
      });
    }
    refreshCheckedState();
    document.addEventListener('change', function(event) {
      if (event.target && (event.target.matches("input[type='radio']") || event.target.matches("input[type='checkbox']"))){
        refreshCheckedState();
      }
    });

    // ── Field-active : highlight cellule active ───────────────────────────────────
    scope.querySelectorAll('input, select, textarea').forEach(function(field) {
      field.addEventListener('focus', function() { var td = field.closest('td, th'); if (td) td.classList.add('field-active'); });
      field.addEventListener('blur',  function() { var td = field.closest('td, th'); if (td) td.classList.remove('field-active'); });
    });
  });
})();
</script>
