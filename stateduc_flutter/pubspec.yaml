name: stateduc_mobile
description: StatEduc Mobile - Application de collecte de données éducatives
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter 3.35.4 embarque Dart 3.9.2
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client avec intercepteurs Basic Auth
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Base de données locale SQLite (remplace localStorage)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Stockage sécurisé PIN + credentials (Keystore/Keychain)
  # v9.2.2 : compatible AGP 8.11 / Gradle 8.14 / Java 17
  # v10.x incompatible : embarque AGP interne 8.13.2 + new DSL AGP9, cassé avec Flutter 3.35.x
  # L'erreur javawriter initiale était due à un cache Gradle corrompu (instrumentation-hierarchy.bin)
  flutter_secure_storage: ^9.2.2

  # Hachage SHA-256 pour les réponses aux questions de sécurité
  crypto: ^3.0.3

  # Préférences simples (cache settings non-sensibles)
  shared_preferences: ^2.3.2

  # Détection connectivité réseau
  connectivity_plus: ^6.1.0

  # Accès répertoires système (pour écriture des fichiers log de cohérence)
  path_provider: ^2.1.4

  # Rendu HTML dynamique des formulaires serveur
  flutter_html: ^3.0.0-beta.2

  # WebView pour rendu fidèle des formulaires HTML serveur
  webview_flutter: ^4.10.0

  # Icônes Material
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
